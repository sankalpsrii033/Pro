<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JARVIS Voice Test v1</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg: #05080f;
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.25);
      --accent-glow: rgba(0, 212, 255, 0.45);
      --text: #e8f4ff;
      --muted: #7a93a8;
      --user-bubble: #12304a;
      --jarvis-bubble: #0d1f2d;
      --danger: #ff5c7a;
      --success: #3dffb5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: radial-gradient(ellipse at top, #0a1525 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex; flex-direction: column; height: 100%;
      max-width: 720px; margin: 0 auto; padding: 16px 16px 24px;
    }
    header { text-align: center; padding: 8px 0 12px; flex-shrink: 0; }
    header h1 {
      font-size: 1.15rem; font-weight: 600; letter-spacing: 0.18em;
      color: var(--accent); text-shadow: 0 0 18px var(--accent-glow);
    }
    header .subtitle { font-size: 0.72rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; }
    .status-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin: 6px 0 14px; flex-shrink: 0;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
      box-shadow: 0 0 8px transparent; transition: all 0.25s ease;
    }
    .status-dot.ready { background: var(--success); box-shadow: 0 0 10px rgba(61,255,181,0.5); }
    .status-dot.listening { background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); animation: pulse 1.2s infinite; }
    .status-dot.busy { background: #ffb347; box-shadow: 0 0 10px rgba(255,179,71,0.45); }
    .status-dot.error { background: var(--danger); box-shadow: 0 0 10px rgba(255,92,122,0.5); }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.35);opacity:0.7} }
    #statusText { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.04em; min-height: 1.2em; }
    .conversation {
      flex: 1; overflow-y: auto; padding: 8px 4px 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    }
    .conversation::-webkit-scrollbar { width: 6px; }
    .conversation::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.25); border-radius: 3px; }
    .msg {
      max-width: 88%; padding: 12px 14px; border-radius: 14px;
      font-size: 0.92rem; line-height: 1.45; word-wrap: break-word;
      animation: fadeIn 0.28s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg.user {
      align-self: flex-end; background: var(--user-bubble);
      border: 1px solid rgba(0,212,255,0.2); border-bottom-right-radius: 4px;
    }
    .msg.jarvis {
      align-self: flex-start; background: var(--jarvis-bubble);
      border: 1px solid rgba(0,212,255,0.12); border-bottom-left-radius: 4px;
    }
    .msg .label {
      display: block; font-size: 0.68rem; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 4px; opacity: 0.65;
    }
    .msg.user .label { color: var(--accent); text-align: right; }
    .msg.jarvis .label { color: #7fdfff; }
    .msg.error-msg {
      align-self: center; background: rgba(255,92,122,0.12);
      border: 1px solid rgba(255,92,122,0.35); color: #ffb3c0;
      font-size: 0.85rem; max-width: 95%; text-align: center;
    }
    .empty-hint {
      margin: auto; text-align: center; color: var(--muted);
      font-size: 0.9rem; opacity: 0.75; padding: 24px;
    }
    .controls {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center; gap: 14px; padding-top: 8px;
    }
    .mic-wrap {
      position: relative; width: 92px; height: 92px;
      display: flex; align-items: center; justify-content: center;
    }
    .mic-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid var(--accent-dim); pointer-events: none; transition: all 0.3s ease;
    }
    .mic-ring.active {
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--accent-glow), inset 0 0 18px var(--accent-dim);
      animation: ringPulse 1.4s ease-in-out infinite;
    }
    @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:0.75} }
    #micBtn {
      width: 72px; height: 72px; border-radius: 50%; border: none;
      background: linear-gradient(145deg, #0e2a3d, #071520);
      color: var(--accent); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 3px var(--accent-dim), 0 8px 24px rgba(0,0,0,0.45);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      position: relative; z-index: 1;
    }
    #micBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 0 3px var(--accent), 0 0 28px var(--accent-glow);
    }
    #micBtn:active:not(:disabled) { transform: scale(0.96); }
    #micBtn:disabled { opacity: 0.45; cursor: not-allowed; }
    #micBtn.recording {
      background: linear-gradient(145deg, #123a52, #0a1c2a);
      box-shadow: 0 0 0 3px var(--accent), 0 0 32px var(--accent-glow); color: #fff;
    }
    #micBtn.active-convo {
      background: linear-gradient(145deg, #1a3a2a, #0a1c12);
      box-shadow: 0 0 0 3px var(--success), 0 0 28px rgba(61,255,181,0.35);
      color: var(--success);
    }
    #micBtn svg { width: 32px; height: 32px; fill: currentColor; }
    .bottom-row {
      display: flex; gap: 12px; align-items: center; justify-content: center; width: 100%;
    }
    .secondary-btn {
      background: transparent; border: 1px solid rgba(122,147,168,0.35);
      color: var(--muted); font-size: 0.78rem; padding: 8px 14px;
      border-radius: 20px; cursor: pointer; letter-spacing: 0.04em; transition: all 0.2s ease;
    }
    .secondary-btn:hover { border-color: var(--accent); color: var(--accent); }
    #playBtn {
      display: none; background: var(--accent); color: #041018;
      border: none; font-weight: 600; padding: 10px 18px;
      border-radius: 22px; cursor: pointer; font-size: 0.85rem;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    #authHint {
      font-size: 0.75rem; color: var(--muted); text-align: center;
      max-width: 280px; line-height: 1.4;
    }
    @media (max-width: 480px) {
      .app { padding: 12px 12px 20px; }
      header h1 { font-size: 1rem; }
      .msg { max-width: 92%; font-size: 0.88rem; }
      .mic-wrap { width: 84px; height: 84px; }
      #micBtn { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>JARVIS VOICE TEST</h1>
      <div class="subtitle">v1 · Prototype</div>
    </header>

    <div class="status-row">
      <div class="status-dot ready" id="statusDot"></div>
      <div id="statusText">Ready</div>
    </div>

    <div class="conversation" id="conversation">
      <div class="empty-hint" id="emptyHint">
        Press the button once to start a continuous conversation.<br />
        Speak naturally — JARVIS will listen, reply, and keep listening.<br />
        Press again to end.
      </div>
    </div>

    <div class="controls">
      <div class="mic-wrap">
        <div class="mic-ring" id="micRing"></div>
        <button id="micBtn" aria-label="Start or End Conversation" title="Start / End Conversation">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>

      <div class="bottom-row">
        <button class="secondary-btn" id="clearBtn">Clear Conversation</button>
        <button id="playBtn">Tap to play</button>
      </div>
      <div id="authHint"></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // ─── Configurable VAD / silence settings ─────────────────────────
      const SILENCE_DURATION = 1100;      // ms of silence after speech → end utterance
      const VOICE_THRESHOLD = 18;         // analyser average (0-255). Raise if too sensitive
      const MIN_RECORDING_DURATION = 700; // ms minimum speech to accept
      const SPEECH_START_FRAMES = 4;      // consecutive loud frames to count as speech start
      const BARGE_IN_THRESHOLD = 28;      // higher threshold while JARVIS is speaking
      const TTS_GUARD_MS = 400;           // ignore mic briefly after TTS starts (anti-echo)

      const SYSTEM_PROMPT = `You are JARVIS, a personal AI assistant prototype.
You are intelligent, calm, concise and conversational.
Speak naturally like a futuristic personal assistant.
The user may speak in English, Hindi or Hinglish.
Reply in the same language/style as the user whenever possible.
For voice responses, keep answers reasonably concise.
Do not pretend that you can control the user's device or perform actions that have not actually been implemented.
This is only a voice conversation prototype.`;

      // ─── State ──────────────────────────────────────────────────────
      let messages = [{ role: "system", content: SYSTEM_PROMPT }];
      let conversationActive = false;
      let mediaRecorder = null;
      let audioChunks = [];
      let isRecording = false;
      let currentAudio = null;
      let isBusy = false;           // true during STT / AI / TTS pipeline
      let recordStartTime = 0;

      let micStream = null;
      let audioContext = null;
      let analyser = null;
      let vadInterval = null;
      let silenceStart = null;
      let speechFrames = 0;
      let isUserSpeaking = false;
      let ttsGuardUntil = 0;        // timestamp until which we ignore mic (anti-echo)
      let mode = "ready";           // ready | listening | recording | processing | speaking

      // ─── DOM ────────────────────────────────────────────────────────
      const conversationEl = document.getElementById("conversation");
      const emptyHint = document.getElementById("emptyHint");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const micBtn = document.getElementById("micBtn");
      const micRing = document.getElementById("micRing");
      const clearBtn = document.getElementById("clearBtn");
      const playBtn = document.getElementById("playBtn");
      const authHint = document.getElementById("authHint");

      function setStatus(state, text) {
        statusDot.className = "status-dot " + state;
        statusText.textContent = text;
      }

      function addMessage(role, text) {
        if (emptyHint && emptyHint.parentNode) emptyHint.remove();
        const div = document.createElement("div");
        div.className = "msg " + (role === "user" ? "user" : "jarvis");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "JARVIS";
        div.appendChild(label);
        div.appendChild(document.createTextNode(text));
        conversationEl.appendChild(div);
        conversationEl.scrollTop = conversationEl.scrollHeight;
      }

      function addError(text) {
        if (emptyHint && emptyHint.parentNode) emptyHint.remove();
        const div = document.createElement("div");
        div.className = "msg error-msg";
        div.textContent = text;
        conversationEl.appendChild(div);
        conversationEl.scrollTop = conversationEl.scrollHeight;
      }

      function extractText(value) {
        if (value == null) return "";
        if (typeof value === "string") return value.trim();
        if (typeof value === "object") {
          if (typeof value.text === "string") return value.text.trim();
          if (value.message) {
            const c = value.message.content;
            if (typeof c === "string") return c.trim();
            if (Array.isArray(c)) {
              return c.filter(b => b && (b.type === "text" || typeof b.text === "string"))
                      .map(b => b.text || "").join("").trim();
            }
          }
          if (typeof value.content === "string") return value.content.trim();
        }
        return "";
      }

      function friendlyError(err) {
        if (!err) return "Unknown error";
        if (typeof err === "string") return err;
        if (err.message) return err.message;
        if (err.error) return String(err.error);
        if (err.msg) return String(err.msg);
        try { return JSON.stringify(err); } catch (e) { return String(err); }
      }

      // ─── Auth ───────────────────────────────────────────────────────
      async function ensureSignedIn() {
        try {
          if (typeof puter === "undefined" || !puter.auth) {
            throw new Error("Puter.js not loaded. Refresh the page.");
          }
          if (puter.auth.isSignedIn && puter.auth.isSignedIn()) {
            authHint.textContent = "";
            return true;
          }
          setStatus("busy", "Sign in required...");
          authHint.textContent = "Allow the Puter sign-in popup...";
          await puter.auth.signIn({ attempt_temp_user_creation: true });
          authHint.textContent = "Signed in ✓";
          setTimeout(() => authHint.textContent = "", 2500);
          return true;
        } catch (err) {
          authHint.textContent = "";
          addError("Puter sign-in failed or cancelled. Error: " + friendlyError(err));
          setStatus("error", "Sign-in needed");
          return false;
        }
      }

      // ─── WAV conversion (kept for STT compatibility) ────────────────
      async function blobToWavFile(blob) {
        try {
          const arrayBuffer = await blob.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          const numChannels = 1;
          const sampleRate = audioBuffer.sampleRate;
          const length = audioBuffer.length;
          const channelData = audioBuffer.getChannelData(0);
          const buffer = new ArrayBuffer(44 + length * 2);
          const view = new DataView(buffer);
          function writeString(offset, str) {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
          }
          writeString(0, "RIFF");
          view.setUint32(4, 36 + length * 2, true);
          writeString(8, "WAVE");
          writeString(12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, numChannels, true);
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * numChannels * 2, true);
          view.setUint16(32, numChannels * 2, true);
          view.setUint16(34, 16, true);
          writeString(36, "data");
          view.setUint32(40, length * 2, true);
          let offset = 44;
          for (let i = 0; i < length; i++) {
            let s = Math.max(-1, Math.min(1, channelData[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            offset += 2;
          }
          audioCtx.close();
          return new File([buffer], "recording.wav", { type: "audio/wav" });
        } catch (e) {
          console.warn("WAV conversion failed, using original", e);
          const ext = (blob.type || "").includes("mp4") ? "mp4" : "webm";
          return new File([blob], "recording." + ext, { type: blob.type || "audio/webm" });
        }
      }

      // ─── Volume helper ──────────────────────────────────────────────
      function getVolume() {
        if (!analyser) return 0;
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        return sum / data.length;
      }

      // ─── Start / End conversation ───────────────────────────────────
      async function startConversation() {
        if (conversationActive) return;

        const ok = await ensureSignedIn();
        if (!ok) return;

        if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
          addError("Microphone / MediaRecorder not supported.");
          setStatus("error", "Unsupported");
          return;
        }

        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              channelCount: 1
            }
          });

          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(micStream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 512;
          analyser.smoothingTimeConstant = 0.4;
          source.connect(analyser);

          conversationActive = true;
          micBtn.classList.add("active-convo");
          micRing.classList.add("active");
          setStatus("listening", "Listening...");
          mode = "listening";

          // Begin continuous listening cycle
          beginListeningCycle();
        } catch (err) {
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            addError("Microphone permission is required for voice conversation.");
            setStatus("error", "Permission denied");
          } else {
            addError("Mic error: " + friendlyError(err));
            setStatus("error", "Mic error");
          }
          endConversation();
        }
      }

      function endConversation() {
        conversationActive = false;
        mode = "ready";
        isBusy = false;
        isRecording = false;
        isUserSpeaking = false;
        speechFrames = 0;
        silenceStart = null;

        stopVad();
        stopMediaRecorder(true);

        if (currentAudio) {
          try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
          currentAudio = null;
        }

        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (audioContext) {
          try { audioContext.close(); } catch (e) {}
          audioContext = null;
          analyser = null;
        }

        micBtn.classList.remove("recording", "active-convo");
        micRing.classList.remove("active");
        playBtn.style.display = "none";
        playBtn.onclick = null;
        setStatus("ready", "Ready");
      }

      // ─── VAD loop ───────────────────────────────────────────────────
      function stopVad() {
        if (vadInterval) {
          clearInterval(vadInterval);
          vadInterval = null;
        }
      }

      function beginListeningCycle() {
        if (!conversationActive) return;
        mode = "listening";
        isUserSpeaking = false;
        speechFrames = 0;
        silenceStart = null;
        audioChunks = [];
        setStatus("listening", "Listening...");
        micBtn.classList.add("recording");
        micRing.classList.add("active");

        stopVad();
        vadInterval = setInterval(vadTick, 50);
      }

      function vadTick() {
        if (!conversationActive || !analyser) return;

        // While processing (STT/AI) do nothing
        if (mode === "processing") return;

        const now = Date.now();
        const vol = getVolume();

        // ── Barge-in while JARVIS is speaking ──
        if (mode === "speaking") {
          if (now < ttsGuardUntil) return; // ignore residual echo right after TTS start
          if (vol >= BARGE_IN_THRESHOLD) {
            // User interrupted
            if (currentAudio) {
              try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
              currentAudio = null;
            }
            mode = "listening";
            isBusy = false;
            // Fall through into normal speech-start logic below
          } else {
            return;
          }
        }

        // ── Normal listening / recording logic ──
        if (mode === "listening" || mode === "recording") {
          if (vol >= VOICE_THRESHOLD) {
            speechFrames++;
            silenceStart = null;

            if (!isUserSpeaking && speechFrames >= SPEECH_START_FRAMES) {
              // Speech started → begin recording
              isUserSpeaking = true;
              startUtteranceRecording();
            }
          } else {
            speechFrames = 0;

            if (isUserSpeaking) {
              if (silenceStart === null) silenceStart = now;
              else if (now - silenceStart >= SILENCE_DURATION) {
                // End of utterance
                const duration = now - recordStartTime;
                if (duration >= MIN_RECORDING_DURATION) {
                  finishUtterance();
                } else {
                  // Too short — discard and keep listening
                  cancelUtterance();
                }
              }
            }
          }
        }
      }

      function startUtteranceRecording() {
        if (isRecording || !micStream) return;
        audioChunks = [];
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/ogg;codecs=opus"
        ];
        let mime = "";
        for (const c of candidates) {
          if (MediaRecorder.isTypeSupported(c)) { mime = c; break; }
        }

        try {
          mediaRecorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : {});
          mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) audioChunks.push(e.data);
          };
          mediaRecorder.onerror = () => {
            cancelUtterance();
          };
          // Do NOT stop tracks on recorder stop — stream stays alive
          mediaRecorder.onstop = () => {
            // processing is triggered by finishUtterance
          };
          mediaRecorder.start(200);
          isRecording = true;
          recordStartTime = Date.now();
          mode = "recording";
          setStatus("listening", "Listening...");
        } catch (e) {
          console.error("MediaRecorder start failed", e);
          cancelUtterance();
        }
      }

      function stopMediaRecorder(release) {
        if (mediaRecorder && (mediaRecorder.state === "recording" || mediaRecorder.state === "paused")) {
          try { mediaRecorder.requestData(); } catch (e) {}
          try { mediaRecorder.stop(); } catch (e) {}
        }
        mediaRecorder = null;
        isRecording = false;
        if (release) audioChunks = [];
      }

      function cancelUtterance() {
        stopMediaRecorder(true);
        isUserSpeaking = false;
        speechFrames = 0;
        silenceStart = null;
        mode = "listening";
        setStatus("listening", "Listening...");
      }

      function finishUtterance() {
        if (!isRecording) return;
        stopVad();
        isUserSpeaking = false;
        speechFrames = 0;
        silenceStart = null;

        // Stop recorder and then process the chunks
        const chunks = audioChunks;
        const mime = mediaRecorder?.mimeType || "audio/webm";

        if (mediaRecorder && (mediaRecorder.state === "recording" || mediaRecorder.state === "paused")) {
          try { mediaRecorder.requestData(); } catch (e) {}
          mediaRecorder.onstop = () => {
            mediaRecorder = null;
            isRecording = false;
            processUtterance(chunks, mime);
          };
          try { mediaRecorder.stop(); } catch (e) {
            mediaRecorder = null;
            isRecording = false;
            processUtterance(chunks, mime);
          }
        } else {
          isRecording = false;
          processUtterance(chunks, mime);
        }
      }

      // ─── Process one utterance (STT → AI → TTS) ─────────────────────
      async function processUtterance(chunks, mime) {
        if (!conversationActive) return;
        mode = "processing";
        isBusy = true;
        setStatus("busy", "Transcribing...");

        if (!chunks || chunks.length === 0) {
          // Nothing useful — go back to listening
          isBusy = false;
          beginListeningCycle();
          return;
        }

        const rawBlob = new Blob(chunks, { type: mime || "audio/webm" });
        if (rawBlob.size < 600) {
          isBusy = false;
          beginListeningCycle();
          return;
        }

        let file;
        try {
          file = await blobToWavFile(rawBlob);
        } catch (e) {
          file = new File([rawBlob], "recording.webm", { type: mime || "audio/webm" });
        }

        // STT
        let userText = "";
        try {
          let sttResult;
          try {
            sttResult = await puter.ai.speech2txt(file, { model: "whisper-1" });
          } catch (e1) {
            sttResult = await puter.ai.speech2txt(file);
          }
          userText = extractText(sttResult);
        } catch (err) {
          console.error("STT error:", err);
          addError("Transcription failed: " + friendlyError(err));
          isBusy = false;
          if (conversationActive) {
            setTimeout(() => beginListeningCycle(), 800);
          }
          return;
        }

        if (!userText || userText.length < 1) {
          // Silence / noise — ignore and keep listening
          isBusy = false;
          if (conversationActive) beginListeningCycle();
          return;
        }

        addMessage("user", userText);
        messages.push({ role: "user", content: userText });

        // AI
        let aiText = "";
        try {
          setStatus("busy", "Thinking...");
          const chatResult = await puter.ai.chat(messages);
          aiText = extractText(chatResult);
          if (!aiText) {
            addError("JARVIS returned an empty response.");
            isBusy = false;
            if (conversationActive) setTimeout(() => beginListeningCycle(), 600);
            return;
          }
          messages.push({ role: "assistant", content: aiText });
          addMessage("jarvis", aiText);
        } catch (err) {
          addError("AI failed: " + friendlyError(err));
          isBusy = false;
          if (conversationActive) setTimeout(() => beginListeningCycle(), 800);
          return;
        }

        // TTS
        try {
          setStatus("busy", "Speaking...");
          mode = "speaking";
          const audio = await puter.ai.txt2speech(aiText);
          currentAudio = audio;
          ttsGuardUntil = Date.now() + TTS_GUARD_MS;

          // Start VAD again so barge-in works while speaking
          stopVad();
          vadInterval = setInterval(vadTick, 50);

          audio.onended = () => {
            currentAudio = null;
            isBusy = false;
            if (conversationActive) beginListeningCycle();
          };
          audio.onerror = () => {
            currentAudio = null;
            isBusy = false;
            if (conversationActive) beginListeningCycle();
          };

          try {
            await audio.play();
          } catch (playErr) {
            // Autoplay blocked — show button, then continue cycle after play
            playBtn.style.display = "inline-block";
            playBtn.onclick = async () => {
              playBtn.style.display = "none";
              try {
                await audio.play();
              } catch (e2) {
                addError("Could not play audio");
                currentAudio = null;
                isBusy = false;
                if (conversationActive) beginListeningCycle();
              }
            };
            setStatus("busy", "Tap to play response");
          }
        } catch (err) {
          addError("TTS failed (text shown): " + friendlyError(err));
          isBusy = false;
          if (conversationActive) setTimeout(() => beginListeningCycle(), 600);
        }
      }

      // ─── Button handlers ────────────────────────────────────────────
      micBtn.addEventListener("click", () => {
        if (conversationActive) {
          endConversation();
        } else {
          startConversation();
        }
      });

      clearBtn.addEventListener("click", () => {
        // End conversation if active, then clear history
        if (conversationActive) endConversation();
        messages = [{ role: "system", content: SYSTEM_PROMPT }];
        conversationEl.innerHTML = "";
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.id = "emptyHint";
        hint.innerHTML = "Press the button once to start a continuous conversation.<br />Speak naturally — JARVIS will listen, reply, and keep listening.<br />Press again to end.";
        conversationEl.appendChild(hint);
        setStatus("ready", "Ready");
      });

      // Initial signed-in check
      setTimeout(() => {
        try {
          if (puter?.auth?.isSignedIn?.()) {
            authHint.textContent = "Signed in with Puter ✓";
            setTimeout(() => authHint.textContent = "", 3000);
          }
        } catch (e) {}
      }, 900);

      setStatus("ready", "Ready");
    })();
  </script>
</body>
</html>
