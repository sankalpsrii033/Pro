<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade GPT Pro Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="logo">🔥 TRADE GPT PRO TERMINAL</div>
  <button id="settingsBtn">API Settings</button>
</header>

<main class="container">
  <section class="panel input-panel">
    <h2>System Inputs</h2>

    <label>Stock Symbol</label>
    <input id="stock" placeholder="NVDA">

    <label>Capital</label>
    <input id="capital" type="number" value="100000">

    <label>Risk %</label>
    <input id="risk" type="number" value="1">

    <label>Mode</label>
    <select id="mode">
      <option>A++ Deep Institutional Analysis</option>
      <option>A+ Balanced Analysis</option>
      <option>B+ Quick Scan</option>
    </select>

    <button id="runBtn">Run Analysis</button>
  </section>

  <section class="panel report-panel">
    <h2>AI Executive Report Card</h2>
    <div id="reportOutput">
      Waiting for analysis...
    </div>
  </section>

  <section class="panel assistant-panel">
    <h2>AI Help Assistant</h2>

    <div id="chatHistory">
      Welcome to Trade GPT Pro Assistant.
    </div>

    <div class="chat-row">
      <input id="chatInput" placeholder="Ask a question...">
      <button id="sendBtn">Send</button>
    </div>
  </section>
</main>

<section class="chart-panel">
  <h2>TradingView Chart</h2>
  <div id="tradingview-widget-container">
    TradingView widget loads here.
  </div>
</section>

<div id="settingsModal" style="display:none;">
  <div class="modal-content">
    <h3>API Configuration</h3>

    <label>OpenRouter API Key</label>
    <input id="orKey" type="password">

    <label>Model Address</label>
    <input id="orModel" placeholder="openai/gpt-5">

    <label>Finnhub API Key</label>
    <input id="finnhubKey" type="password">

    <button id="saveSettings">Save</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
